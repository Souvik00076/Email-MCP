services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: email-mcp-app-dev
    ports:
      - "8002:8000"
    env_file:
      - .env
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
    volumes:
      - type: bind
        source: .
        target: /app
      - type: volume
        target: /app/__pycache__
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - email-mcp-dev-net

  redis:
    image: redis:7-alpine
    container_name: email-mcp-redis-dev
    ports:
      - "6379:6379"
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - email-mcp-dev-net

networks:
  email-mcp-dev-net:
    driver: bridge
